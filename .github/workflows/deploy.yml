name: Deploy DevOps Portfolio

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add Remote Host to Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare Remote Directory
        run: |
          ssh ec2-user@${{ secrets.EC2_HOST }} "mkdir -p /home/ec2-user/project"

      - name: Sync Files to EC2 via rsync
        run: |
          rsync -avz --exclude '.git' --exclude 'terra/.terraform/' ./ ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/project/

      - name: Execute Remote Deployment
        run: |
          ssh ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ec2-user/project/terra
            terraform init
            terraform apply -auto-approve
          EOF
